name: developers_hub
description: A job search mobile application for developers

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6
  
  # State Management
  provider: ^6.1.5+1
  
  # Image Picker
  image_picker: ^1.2.1
  
  # Date Formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7  # Splash screen package

flutter:
  uses-material-design: true
  
  # Assets section - this was misplaced in your file
  assets:
    - assets/images/logo.png
    - assets/images/splash_logo.png

# Splash screen configuration - this should be at the root level, not inside flutter
flutter_native_splash:
  color: "#FFFFFF" # Background color (white)
  image: assets/images/splash_logo.png # Your splash logo image
  android: true
  ios: true
  web: false

  # Android 12+ specific settings
  android_12:
    color: "#FFFFFF"
    image: assets/images/splash_logo.png
  
  # Customize branding
  fullscreen: true